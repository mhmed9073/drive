<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon Drive</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l2 2h7.8A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-10Z"/>
    </symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l2 2h7.8A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-10Z"/>
      <path d="M12 11v6M9 14h6"/>
    </symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h7l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
      <path d="M13 3v5h5"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <circle cx="8.5" cy="9.5" r="1.5"/>
      <path d="m4 17 5-5 4 4 3-3 4 4"/>
    </symbol>
    <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <path d="m10 9 5 3-5 3V9Z"/>
    </symbol>
    <symbol id="i-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V6l10-2v12"/>
      <circle cx="6.5" cy="18" r="2.5"/>
      <circle cx="16.5" cy="16" r="2.5"/>
    </symbol>
    <symbol id="i-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="5" rx="1"/>
      <path d="M5 9v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/>
      <path d="M10 13h4"/>
    </symbol>
    <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 8-4 4 4 4"/>
      <path d="m15 8 4 4-4 4"/>
    </symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
      <path d="M14 3v4h4"/>
      <path d="M8 13h6M8 16h8M8 19h4"/>
    </symbol>
    <symbol id="i-sheet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M3 10h18M9 10v10M15 10v10"/>
    </symbol>
    <symbol id="i-slides" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="2"/>
      <path d="M12 16v4M8 20h8"/>
    </symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="m7 9 3 3-3 3M13 15h4"/>
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4M7 9l5-5 5 5"/>
      <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
    </symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h4l10-10a2.1 2.1 0 0 0-3-3L5 17v3Z"/>
      <path d="m13.5 6.5 3 3"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>
      <path d="M10 11v6M14 11v6"/>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"/>
      <path d="M15 8l4 4-4 4M19 12H9"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/>
    </symbol>
  </svg>

  <main id="login" class="login" hidden>
    <button class="btn ghost icon-only theme-toggle login-theme" type="button" aria-label="Passer en sombre">
      <svg class="btn-icon theme-icon-sun"><use href="#i-sun"/></svg>
      <svg class="btn-icon theme-icon-moon"><use href="#i-moon"/></svg>
    </button>
    <form id="login-form" class="login-card">
      <div class="brand"><svg class="brand-icon"><use href="#i-folder"/></svg><span>Mon Drive</span></div>
      <p class="login-hint">Accès protégé par mot de passe.</p>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="login-btn" class="btn primary block" type="submit">Entrer</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand"><svg class="brand-icon"><use href="#i-folder"/></svg><span id="title">Mon Drive</span></div>
      <div class="topbar-actions">
        <button class="btn ghost icon-only theme-toggle" type="button" aria-label="Passer en sombre">
          <svg class="btn-icon theme-icon-sun"><use href="#i-sun"/></svg>
          <svg class="btn-icon theme-icon-moon"><use href="#i-moon"/></svg>
        </button>
        <button id="logout" class="btn ghost" type="button"><svg class="btn-icon"><use href="#i-logout"/></svg>Déconnexion</button>
      </div>
    </header>

    <div class="toolbar">
      <nav id="crumbs" class="crumbs" aria-label="Fil d’Ariane"></nav>
      <div class="actions">
        <button id="new-folder" class="btn ghost" type="button"><svg class="btn-icon"><use href="#i-folder-plus"/></svg>Nouveau dossier</button>
        <button id="upload-btn" class="btn primary" type="button"><svg class="btn-icon"><use href="#i-upload"/></svg>Importer</button>
        <input id="file-input" type="file" multiple hidden>
      </div>
    </div>

    <main class="content">
      <div class="list-head" aria-hidden="true">
        <span>Nom</span><span>Taille</span><span>Modifié</span><span></span>
      </div>
      <div id="list" class="list"></div>
      <div id="empty" class="empty" hidden>
        <svg class="empty-icon"><use href="#i-folder"/></svg>
        <p>Ce dossier est vide.</p>
        <p class="muted">Glisse des fichiers ici ou utilise « Importer ».</p>
      </div>
    </main>

    <footer class="statusbar">
      <span id="count"></span>
      <span id="free"></span>
    </footer>

    <div id="drop" class="drop"><div class="drop-inner">Déposez pour importer</div></div>
    <div id="transfers" class="transfers" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
